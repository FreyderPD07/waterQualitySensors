<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HelioWater | WaterMLdetect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i_logo" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></symbol>
    <symbol id="i_dashboard" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></symbol>
    <symbol id="i_perfil" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i_menu" viewBox="0 0 24 24"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></symbol>
    <symbol id="i_enviar" viewBox="0 0 24 24"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></symbol>
    <symbol id="i_nuevo" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i_copiar" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
    <symbol id="i_salir" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></symbol>
  </svg>

  <div class="aplicacion pagina_chat" id="chat_pagina">
    <aside class="barra_lateral">
      <a class="marca" href="index.html">
        <svg class="icono" aria-hidden="true"><use href="#i_logo"/></svg>
        <span>WaterMLdetect</span>
      </a>
      <nav aria-label="Navegación principal">
        <a href="dashboard.html"><svg class="icono" aria-hidden="true"><use href="#i_dashboard"/></svg>Dashboard</a>
        <a href="perfil.html"><svg class="icono" aria-hidden="true"><use href="#i_perfil"/></svg>Mi perfil</a>
      </nav>
      <footer>
        <button type="button" id="boton_salir_chat"><svg class="icono" aria-hidden="true"><use href="#i_salir"/></svg>Cerrar sesión</button>
        <p class="pie_credito_sidebar">© Helio Mind Labs<br>Equipo de investigadores</p>
      </footer>
    </aside>

    <main class="contenido chat_pagina_cuerpo">
      <button type="button" class="boton_icono boton_menu" aria-label="Abrir menú" aria-expanded="false"><svg class="icono" aria-hidden="true"><use href="#i_menu"/></svg></button>
      <section class="chat chat_pagina_panel" id="chat_ia" aria-label="Chat con HelioWater">
        <header class="chat_encabezado">
          <h2 class="chat_titulo">HelioWater</h2>
          <div class="chat_acciones">
            <button type="button" id="boton_nueva_conversacion" class="chat_boton_accion" aria-label="Nueva conversación" title="Nueva conversación"><svg class="icono" aria-hidden="true"><use href="#i_nuevo"/></svg></button>
          </div>
        </header>

        <ol id="chat_mensajes" role="log" aria-live="polite" aria-relevant="additions"></ol>

        <p id="chat_estado" class="chat_estado" hidden>
          <span class="chat_puntos" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>HelioWater está pensando…</span>
        </p>

        <form id="form_chat" novalidate>
          <div class="chat_compositor">
            <label for="chat_entrada" class="solo_lectores">Tu pregunta</label>
            <input id="chat_entrada" name="pregunta" maxlength="300" autocomplete="off" placeholder="Escribe tu pregunta para HelioWater…">
            <button type="submit" id="boton_enviar_chat" class="chat_enviar" aria-label="Enviar pregunta" title="Enviar"><svg class="icono" aria-hidden="true"><use href="#i_enviar"/></svg></button>
          </div>
          <p class="chat_pie"><span>HelioWater analiza los registros del sistema</span><span id="chat_contador">0/300</span></p>
        </form>
      </section>
    </main>
  </div>

  <script src="app/index.js"></script>
  <script src="app/chat.js"></script>
  <script>
    document.querySelector(".boton_menu")?.addEventListener("click", () => {
      document.querySelector(".barra_lateral")?.classList.toggle("abierta");
    });
  </script>
</body>
</html>
