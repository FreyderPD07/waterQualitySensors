<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaterQualitySensors - Inicio de Sesión</title>
    <!-- Hoja de estilos global centralizada -->
    <link rel="stylesheet" href="../../public/css/styles.css">
</head>
<body class="auth-body">

    <main class="auth-container">
        <section class="auth-card">
            
            <!-- Encabezado de la tarjeta -->
            <header class="auth-header">
                <div class="auth-logo-icon" aria-hidden="true">💧</div>
                <h1 class="auth-title">Calidad de Agua</h1>
                <p class="auth-subtitle">Ingresa tus credenciales para acceder al sistema</p>
            </header>

            <!-- Mensaje de estado dinámico (Errores / Éxito para JS futuro) -->
            <div id="login-alert" class="auth-alert auth-alert-hidden" role="alert">
                <span id="login-alert-text"></span>
            </div>

            <!-- Formulario de autenticación -->
            <form id="login-form" class="auth-form" action="#" method="POST" novalidate>
                
                <div class="form-group">
                    <label for="login-email" class="form-label">Correo Electrónico</label>
                    <input 
                        type="email" 
                        id="login-email" 
                        name="email" 
                        class="form-input" 
                        placeholder="ejemplo@sensor.com" 
                        required 
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="login-password" class="form-label">Contraseña</label>
                    <input 
                        type="password" 
                        id="login-password" 
                        name="password" 
                        class="form-input" 
                        placeholder="••••••••" 
                        required 
                        autocomplete="current-password"
                    >
                </div>

                <div class="auth-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="login-remember" name="remember" class="checkbox-input">
                        <span>Recordar sesión</span>
                    </label>
                    <a href="#" class="auth-link-secondary">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" id="login-submit-btn" class="btn btn-primary auth-btn">
                    <span>Iniciar Sesión</span>
                </button>

            </form>

            <!-- Pie de tarjeta para navegación -->
            <footer class="auth-footer">
                <p class="auth-footer-text">
                    ¿No tienes una cuenta? 
                    <a href="register.html" class="auth-link-primary">Regístrate aquí</a>
                </p>
            </footer>

        </section>
    </main>

    <!-- Script de conexión cliente/API futuro -->
    <script src="../../public/js/login.js"></script>
</body>
</html>
