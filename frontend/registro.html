<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | WaterMLdetect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <main class="vista vista_acceso">
    <aside class="panel_marca">
      <h1 class="marca_acceso">
        <svg class="icono" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
        <span>WaterMLdetect</span>
      </h1>
      <p class="mensaje_marca">El agua de tu comunidad, bajo control.</p>
    </aside>

    <section class="panel_formulario" aria-labelledby="titulo_registro">
      <form id="form_registro" novalidate>
        <header class="encabezado_formulario">
          <h2 id="titulo_registro">Crear una cuenta</h2>
          <p>Regístrate para seguir las mediciones de tu comunidad.</p>
        </header>
        <fieldset>
          <legend>Datos de la cuenta</legend>
          <p>
            <label for="reg_usuario">Usuario (letras y números)</label>
            <input id="reg_usuario" type="text" name="usuario" maxlength="50">
          </p>
          <p>
            <label for="reg_nombre">Nombres y apellidos</label>
            <input id="reg_nombre" type="text" name="nombre" maxlength="50">
          </p>
          <p>
            <label for="reg_email">Correo electrónico</label>
            <input id="reg_email" type="email" name="email" maxlength="80">
          </p>
          <p>
            <label for="reg_telefono">Teléfono</label>
            <input id="reg_telefono" type="tel" name="telefono" maxlength="15">
          </p>
          <p>
            <label for="reg_vereda">Vereda o comunidad</label>
            <input id="reg_vereda" type="text" name="vereda" maxlength="80" value="San Pedro">
          </p>
          <p>
            <label for="reg_clave">Contraseña (8 a 12 caracteres, con mayúscula, número y símbolo)</label>
            <input id="reg_clave" type="password" name="password" autocomplete="new-password">
          </p>
          <p>
            <label for="reg_confirmacion">Confirmar contraseña</label>
            <input id="reg_confirmacion" type="password" name="confirmacion" autocomplete="new-password">
          </p>
        </fieldset>
        <output class="mensaje_error" id="error_registro" aria-live="polite"></output>
        <button type="submit" class="boton_principal">Crear cuenta</button>
      </form>

      <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
      <p class="pie_acceso">© Helio Mind Labs · Equipo de investigadores<br>WaterMLdetect — Monitoreo de calidad del agua</p>
    </section>
  </main>

  <script src="app/index.js"></script>
  <script src="app/registro.js"></script>
</body>
</html>
