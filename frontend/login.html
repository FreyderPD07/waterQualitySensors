<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | WaterMLdetect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <main class="vista vista_acceso">
    <aside class="panel_marca">
      <h1 class="marca_acceso">
        <svg class="icono" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
        <span>WaterMLdetect</span>
      </h1>
      <p class="mensaje_marca">El agua de tu comunidad, bajo control.</p>
    </aside>

    <section class="panel_formulario" aria-labelledby="titulo_login">
      <form id="form_login" novalidate>
        <header class="encabezado_formulario">
          <h2 id="titulo_login">¡Qué bueno tenerte de vuelta!</h2>
          <p>Ingresa a tu cuenta para consultar el estado del agua.</p>
        </header>

        <p>
          <label for="login_email">Correo electrónico</label>
          <input id="login_email" type="email" name="email" maxlength="80" autocomplete="username">
        </p>
        <p>
          <label for="login_clave">Contraseña</label>
          <input id="login_clave" type="password" name="password" autocomplete="current-password">
        </p>
        <output class="mensaje_error" id="error_login" aria-live="polite"></output>
        <button type="submit" class="boton_principal">Iniciar sesión</button>
      </form>

      <p>¿Aún no tienes cuenta? <a href="registro.html">Regístrate</a></p>
      <p class="pie_acceso">© Helio Mind Labs · Equipo de investigadores<br>WaterMLdetect — Monitoreo de calidad del agua</p>
    </section>
  </main>

  <script src="app/index.js"></script>
  <script src="app/login.js"></script>
</body>
</html>
