<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil | WaterMLdetect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i_logo" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></symbol>
    <symbol id="i_dashboard" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></symbol>
    <symbol id="i_perfil" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i_menu" viewBox="0 0 24 24"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></symbol>
    <symbol id="i_salir" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></symbol>
  </svg>

  <div class="aplicacion pagina_chat pagina_perfil" id="chat_pagina">
    <aside class="barra_lateral">
      <a class="marca" href="index.html">
        <svg class="icono" aria-hidden="true"><use href="#i_logo"/></svg>
        <span>WaterMLdetect</span>
      </a>
      <nav aria-label="Navegación principal">
        <a href="dashboard.html"><svg class="icono" aria-hidden="true"><use href="#i_dashboard"/></svg>Dashboard</a>
        <a href="perfil.html" class="activa"><svg class="icono" aria-hidden="true"><use href="#i_perfil"/></svg>Mi perfil</a>
      </nav>
      <footer>
        <button type="button" id="boton_salir_perfil"><svg class="icono" aria-hidden="true"><use href="#i_salir"/></svg>Cerrar sesión</button>
        <p class="pie_credito_sidebar">© Helio Mind Labs<br>Equipo de investigadores</p>
      </footer>
    </aside>

    <main class="contenido perfil_cuerpo">
      <button type="button" class="boton_icono boton_menu" aria-label="Abrir menú" aria-expanded="false"><svg class="icono" aria-hidden="true"><use href="#i_menu"/></svg></button>
      <section class="panel_formulario perfil_panel" aria-labelledby="titulo_perfil">
        <form id="form_perfil" novalidate>
          <header class="encabezado_formulario">
            <h2 id="titulo_perfil">Mi perfil</h2>
            <p>Actualiza tus datos de contacto. El correo y el usuario no se pueden cambiar.</p>
          </header>

          <fieldset>
            <legend>Datos personales</legend>
            <p>
              <label for="perfil_usuario">Usuario</label>
              <input id="perfil_usuario" type="text" readonly disabled>
            </p>
            <p>
              <label for="perfil_email">Correo electrónico</label>
              <input id="perfil_email" type="email" readonly disabled>
            </p>
            <p>
              <label for="perfil_nombre">Nombres y apellidos</label>
              <input id="perfil_nombre" type="text" name="nombre" maxlength="80" required>
            </p>
            <p>
              <label for="perfil_telefono">Teléfono</label>
              <input id="perfil_telefono" type="tel" name="telefono" maxlength="15" required>
            </p>
            <p>
              <label for="perfil_vereda">Vereda o comunidad</label>
              <input id="perfil_vereda" type="text" name="vereda" maxlength="80" required>
            </p>
          </fieldset>

          <fieldset>
            <legend>Cambiar contraseña (opcional)</legend>
            <p>
              <label for="perfil_clave_actual">Contraseña actual</label>
              <input id="perfil_clave_actual" type="password" name="passwordActual" autocomplete="current-password">
            </p>
            <p>
              <label for="perfil_clave">Nueva contraseña (8 a 12 caracteres, con mayúscula, número y símbolo)</label>
              <input id="perfil_clave" type="password" name="password" autocomplete="new-password">
            </p>
            <p>
              <label for="perfil_clave_confirmar">Confirmar nueva contraseña</label>
              <input id="perfil_clave_confirmar" type="password" name="confirmacion" autocomplete="new-password">
            </p>
          </fieldset>

          <output class="mensaje_error" id="error_perfil" aria-live="polite"></output>
          <output class="mensaje_ok" id="ok_perfil" aria-live="polite"></output>
          <button type="submit" class="boton_principal">Guardar cambios</button>
        </form>
      </section>
    </main>
  </div>

  <script src="app/index.js"></script>
  <script src="app/perfil.js"></script>
  <script>
    document.querySelector(".boton_menu")?.addEventListener("click", () => {
      document.querySelector(".barra_lateral")?.classList.toggle("abierta");
    });
  </script>
</body>
</html>
